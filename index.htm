<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Quiz App</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header class="app-header">
        <h1>🧠 DevOps Quiz</h1>
    </header>

    <div id="startScreen" class="card controls">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
            <option value="all">All</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>
        <button class="primary-btn" onclick="startQuiz()">Start Quiz 🚀</button>
    </div>

    <div id="quizBox" class="card hidden">
        <div class="top-bar">
            <span class="badge timer-badge" id="timer">⏱️ 30s</span>
            <!-- Question Counter -->
            <span class="badge counter-badge" id="questionCount"></span>
            <span class="badge score-badge" id="score">Score: 0</span>
        </div>

        <div class="question-wrapper">
            <h2 id="question"></h2>
            <div id="options" class="options-container"></div>
        </div>

        <p id="result"></p>

        <div class="nav-buttons">
            <button class="secondary-btn" id="prevBtn" onclick="prevQuestion()">⬅️ Previous</button>
            <button class="primary-btn" id="nextBtn" onclick="nextQuestion()">Next ➡️</button>
        </div>
    </div>

    <div id="endScreen" class="card hidden text-center">
        <h2>🎉 Quiz Finished!</h2>
        <p id="finalScore" class="final-score-text"></p>
        <button class="primary-btn" onclick="location.reload()">🔄 Restart</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
